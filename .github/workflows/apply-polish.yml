name: Apply UI polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: "!contains(github.event.head_commit.message, '[ui-polish]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Attach professional polish layer
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="professional-polish.css">'

          if marker not in text:
              head = text.lower().find('</head>')
              if head == -1:
                  raise SystemExit('index.html does not contain </head>')
              text = text[:head] + '  ' + marker + '\n' + text[head:]
              path.write_text(text, encoding='utf-8')

      - name: Commit polish attachment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Apply professional UI polish [ui-polish]"
            git push
          fi
